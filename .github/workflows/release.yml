name: release

# Publishes every packable project to NuGet when you push a version tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Auth uses NuGet Trusted Publishing (OIDC) — no long-lived API key secret.
# One-time setup on nuget.org (Account → Trusted Publishing → Add):
#   Repository owner : dyzenment
#   Repository       : VirtualFileSystem
#   Workflow file    : release.yml         (file name only, not the full path)
#   Environment      : (leave empty)
# Then set the `user:` field below to your nuget.org profile name.

on:
  push:
    tags: [ 'v*.*.*' ]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required: lets the job request an OIDC token
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore -p:Version=${{ steps.ver.outputs.version }}

      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal

      - name: Pack
        run: >
          dotnet pack -c Release --no-build
          -p:Version=${{ steps.ver.outputs.version }}
          -o artifacts

      - name: NuGet login (Trusted Publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: dyzenment   # <-- your nuget.org PROFILE name (not an email)

      - name: Push to NuGet
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
